name: Build Yamone V0.3.6 APK

on:
  push:
    branches:
      - snorelab-v0.1-build
      - yamone-sleep-ui
    paths:
      - 'snorelab/**'
      - '.github/workflows/snorelab-v01-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Yamone mascot assets
        shell: bash
        run: |
          mkdir -p snorelab/app/src/main/res/drawable-nodpi
          base64 -d snorelab/assets/yamone_alarm.webp.b64 > snorelab/app/src/main/res/drawable-nodpi/yamone_alarm.webp
          base64 -d snorelab/assets/yamone_activity.webp.b64 > snorelab/app/src/main/res/drawable-nodpi/yamone_activity.webp
          base64 -d snorelab/assets/yamone_home.webp.b64 > snorelab/app/src/main/res/drawable-nodpi/yamone_home.webp
          base64 -d snorelab/assets/yamone_ski.webp.b64 > snorelab/app/src/main/res/drawable-nodpi/yamone_ski.webp

      - name: Apply V0.1.1 UI patch
        run: python3 snorelab/tools/apply_v011_ui.py

      - name: Apply V0.2 alarm navigation patch
        run: python3 snorelab/tools/apply_v020_alarm_nav.py

      - name: Apply V0.3 activity navigation patch
        run: python3 snorelab/tools/apply_v030_activity_nav.py

      - name: Apply V0.3.2 real map patch
        run: python3 snorelab/tools/apply_v032_map.py

      - name: Apply Yamone sleep UI patch
        run: python3 snorelab/tools/apply_v033_yamone_sleep_ui.py

      - name: Apply Yamone five-tab shell patch
        run: python3 snorelab/tools/apply_v034_yamone_shell.py

      - name: Apply status bar and sleep refresh patch
        run: python3 snorelab/tools/apply_v035_status_refresh.py

      - name: Apply fixed top and bottom chrome patch
        run: python3 snorelab/tools/apply_v036_fixed_chrome.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yamone-debug-keystore-v1

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: snorelab
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-v0.3.6-fixed-chrome-debug-apk
          path: snorelab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
