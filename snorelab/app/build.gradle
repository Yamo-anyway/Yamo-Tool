plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yamo.snorelab'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yamo.snorelab'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.3.3-yamone-sleep'
        manifestPlaceholders = [appLabel: '야모네']
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            manifestPlaceholders = [appLabel: '야모네 DEV']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:13.4.1'
}
